<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#1e2a5a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="470" r="360" fill="url(#glow)"/>
  <!-- orbit rings -->
  <g fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.35">
    <ellipse cx="800" cy="470" rx="320" ry="110"/>
    <ellipse cx="800" cy="470" rx="320" ry="110" transform="rotate(60 800 470)"/>
    <ellipse cx="800" cy="470" rx="320" ry="110" transform="rotate(120 800 470)"/>
  </g>
  <!-- atoms -->
  <g fill="#22d3ee">
    <circle cx="1120" cy="470" r="12"/>
    <circle cx="480" cy="470" r="12"/>
    <circle cx="800" cy="360" r="10"/>
    <circle cx="960" cy="580" r="10"/>
    <circle cx="640" cy="580" r="10"/>
  </g>
  <!-- play button -->
  <g transform="translate(800,470)">
    <circle r="110" fill="#22d3ee" opacity="0.15" stroke="#22d3ee" stroke-width="4"/>
    <polygon points="-34,-52 -34,52 56,0" fill="#22d3ee"/>
  </g>
  <!-- science icons small -->
  <g stroke="#a78bfa" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8">
    <!-- dna-ish helix left -->
    <path d="M230 260 C260 320 260 400 230 460 C200 520 200 600 230 660"/>
    <path d="M300 260 C270 320 270 400 300 460 C330 520 330 600 300 660"/>
  </g>
  <g fill="#fbbf24" opacity="0.9">
    <circle cx="1320" cy="260" r="6"/>
    <circle cx="1360" cy="300" r="4"/>
    <circle cx="1280" cy="320" r="5"/>
  </g>
  <text x="800" y="200" font-family="Inter, system-ui, sans-serif" font-size="130" font-weight="800" text-anchor="middle" fill="#ffffff">STEMstream</text>
  <text x="800" y="790" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="600" text-anchor="middle" fill="#c7d2fe">A curated library of mind-expanding STEM videos</text>
</svg>