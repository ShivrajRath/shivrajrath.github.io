<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fce7f3"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- sun -->
  <circle cx="1320" cy="180" r="90" fill="#fbbf24" opacity="0.8"/>
  <!-- books stack -->
  <g transform="translate(800,520)">
    <rect x="-320" y="60" width="640" height="50" rx="10" fill="#a78bfa"/>
    <rect x="-290" y="0" width="580" height="60" rx="10" fill="#f472b6"/>
    <rect x="-260" y="-60" width="520" height="60" rx="10" fill="#34d399"/>
    <rect x="-230" y="-120" width="460" height="60" rx="10" fill="#60a5fa"/>
    <rect x="-200" y="-180" width="400" height="60" rx="10" fill="#fbbf24"/>
    <!-- spines labels -->
    <g font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">
      <text x="0" y="-145">ages 0-3</text>
      <text x="0" y="-85">ages 3-5</text>
      <text x="0" y="-25">ages 5-8</text>
      <text x="0" y="35">ages 8-12</text>
      <text x="0" y="95">teens</text>
    </g>
  </g>
  <!-- stars -->
  <g fill="#f472b6">
    <polygon points="260,200 272,236 310,236 280,258 292,294 260,272 228,294 240,258 210,236 248,236"/>
  </g>
  <g fill="#60a5fa">
    <polygon points="1320,600 1332,636 1370,636 1340,658 1352,694 1320,672 1288,694 1300,658 1270,636 1308,636"/>
  </g>
  <!-- balloons -->
  <g>
    <circle cx="300" cy="360" r="46" fill="#f87171"/>
    <line x1="300" y1="406" x2="300" y2="500" stroke="#78350f" stroke-width="3"/>
    <circle cx="1280" cy="420" r="40" fill="#34d399"/>
    <line x1="1280" y1="460" x2="1280" y2="560" stroke="#78350f" stroke-width="3"/>
  </g>
  <text x="800" y="170" font-family="Inter, system-ui, sans-serif" font-size="120" font-weight="800" text-anchor="middle" fill="#7c3aed">Golden Shelf Kids</text>
  <text x="800" y="820" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" text-anchor="middle" fill="#7c3aed">A curated library of age-appropriate books for children &amp; teens</text>
</svg>