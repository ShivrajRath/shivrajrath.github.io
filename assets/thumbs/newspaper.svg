<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf7f0"/>
      <stop offset="1" stop-color="#e7e0d2"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- newspaper page -->
  <g transform="translate(260,180)">
    <rect width="1080" height="560" fill="#ffffff" stroke="#1f2a44" stroke-width="10"/>
    <!-- masthead -->
    <rect x="20" y="20" width="1040" height="90" fill="#1f2a44"/>
    <text x="540" y="82" font-family="Georgia, serif" font-size="64" font-weight="700" text-anchor="middle" fill="#faf7f0">THE DAILY BRIEF</text>
    <!-- columns -->
    <g fill="#1f2a44" opacity="0.85">
      <rect x="40" y="130" width="480" height="18" rx="4"/>
      <rect x="40" y="165" width="460" height="12" rx="3"/>
      <rect x="40" y="190" width="470" height="12" rx="3"/>
      <rect x="40" y="215" width="440" height="12" rx="3"/>
      <rect x="40" y="250" width="480" height="18" rx="4"/>
      <rect x="40" y="285" width="450" height="12" rx="3"/>
      <rect x="40" y="310" width="470" height="12" rx="3"/>
      <rect x="40" y="335" width="420" height="12" rx="3"/>
      <rect x="560" y="130" width="480" height="18" rx="4"/>
      <rect x="560" y="165" width="460" height="12" rx="3"/>
      <rect x="560" y="190" width="470" height="12" rx="3"/>
      <rect x="560" y="215" width="440" height="12" rx="3"/>
      <rect x="560" y="250" width="480" height="18" rx="4"/>
      <rect x="560" y="285" width="450" height="12" rx="3"/>
      <rect x="560" y="310" width="470" height="12" rx="3"/>
      <rect x="560" y="335" width="420" height="12" rx="3"/>
      <rect x="40" y="380" width="1000" height="18" rx="4"/>
      <rect x="40" y="415" width="980" height="12" rx="3"/>
      <rect x="40" y="440" width="1000" height="12" rx="3"/>
      <rect x="40" y="465" width="960" height="12" rx="3"/>
      <rect x="40" y="490" width="990" height="12" rx="3"/>
    </g>
    <!-- image placeholder -->
    <rect x="40" y="520" width="320" height="180" fill="#d6d3d1"/>
    <g stroke="#78716c" stroke-width="4" opacity="0.6">
      <line x1="40" y1="520" x2="360" y2="700"/>
      <line x1="40" y1="700" x2="360" y2="520"/>
    </g>
  </g>
  <text x="800" y="120" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="700" text-anchor="middle" fill="#1f2a44">The Daily Brief</text>
  <text x="800" y="820" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" text-anchor="middle" fill="#1f2a44">Stop doomscrolling. Get your daily news in one place.</text>
</svg>