<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="pan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#44403c"/>
      <stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- steam -->
  <g stroke="#d6d3d1" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M620 260 Q640 220 620 180 Q600 140 620 100"/>
    <path d="M700 270 Q720 230 700 190 Q680 150 700 110"/>
    <path d="M780 260 Q800 220 780 180 Q760 140 780 100"/>
  </g>
  <!-- pan -->
  <g transform="translate(800,560)">
    <ellipse cx="0" cy="0" rx="360" ry="110" fill="url(#pan)"/>
    <ellipse cx="0" cy="-20" rx="300" ry="80" fill="#78350f"/>
    <!-- food blobs -->
    <circle cx="-120" cy="-30" r="46" fill="#f97316"/>
    <circle cx="0" cy="-50" r="52" fill="#dc2626"/>
    <circle cx="130" cy="-25" r="44" fill="#facc15"/>
    <circle cx="-40" cy="10" r="38" fill="#16a34a"/>
    <circle cx="90" cy="15" r="36" fill="#ea580c"/>
    <!-- handle -->
    <rect x="360" y="-25" width="220" height="30" rx="15" fill="url(#pan)"/>
  </g>
  <!-- utensils -->
  <g stroke="#78350f" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="260" y1="300" x2="260" y2="470"/>
    <circle cx="260" cy="285" r="26" fill="none"/>
    <line x1="1340" y1="320" x2="1340" y2="490"/>
    <path d="M1314 300 Q1340 270 1366 300" fill="none"/>
  </g>
  <!-- herbs -->
  <g fill="#16a34a">
    <ellipse cx="520" cy="620" rx="14" ry="8" transform="rotate(-30 520 620)"/>
    <ellipse cx="560" cy="640" rx="14" ry="8" transform="rotate(20 560 640)"/>
    <ellipse cx="1080" cy="620" rx="14" ry="8" transform="rotate(30 1080 620)"/>
  </g>
  <text x="800" y="160" font-family="Inter, system-ui, sans-serif" font-size="130" font-weight="800" text-anchor="middle" fill="#7c2d12">Cookspan</text>
  <text x="800" y="820" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="600" text-anchor="middle" fill="#7c2d12">Recipes, notes, and stories from Shreemaa's Kitchen</text>
</svg>