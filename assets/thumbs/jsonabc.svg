<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- code window -->
  <g transform="translate(250,230)">
    <rect width="1100" height="440" rx="24" fill="#064e3b" opacity="0.92"/>
    <rect width="1100" height="44" rx="24" fill="#065f46"/>
    <circle cx="32" cy="22" r="8" fill="#f87171"/>
    <circle cx="60" cy="22" r="8" fill="#fbbf24"/>
    <circle cx="88" cy="22" r="8" fill="#34d399"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" fill="#d1fae5">
      <text x="40" y="100">{</text>
      <text x="80" y="150">"alpha": 1,</text>
      <text x="80" y="200">"beta": 2,</text>
      <text x="80" y="250">"gamma": 3,</text>
      <text x="80" y="300">"zeta": 4</text>
      <text x="40" y="350">}</text>
    </g>
    <!-- arrow -->
    <g stroke="#065f46" stroke-width="14" stroke-linecap="round" fill="none">
      <line x1="460" y1="220" x2="640" y2="220"/>
      <polyline points="600,185 640,220 600,255"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" fill="#a7f3d0">
      <text x="700" y="100">{</text>
      <text x="740" y="150">"alpha": 1,</text>
      <text x="740" y="200">"beta": 2,</text>
      <text x="740" y="250">"gamma": 3,</text>
      <text x="740" y="300">"zeta": 4</text>
      <text x="700" y="350">}</text>
    </g>
  </g>
  <!-- check badge -->
  <g transform="translate(1320,260)">
    <circle r="52" fill="#10b981"/>
    <polyline points="-22,0 -6,18 24,-18" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="800" y="170" font-family="Inter, system-ui, sans-serif" font-size="130" font-weight="800" text-anchor="middle" fill="#064e3b">JSON ABC</text>
  <text x="800" y="800" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="600" text-anchor="middle" fill="#064e3b">Sort JSON objects alphabetically</text>
</svg>